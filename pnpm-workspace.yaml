# pnpm settings for this repository. This is a single-package project, so this
# file exists to carry settings that pnpm 11 reads from here rather than from
# package.json.
packages:
  - "."

# Build scripts that are allowed to run. Every other dependency is denied.
#
# Allowed, and why:
#   @tailwindcss/oxide  Tailwind 4 native binary. Required by postcss build.
#   esbuild            Required by the Tailwind 4 toolchain.
#   workerd            Required by next build and next dev.
#   unrs-resolver      Native resolver used by eslint-config-next for lint.
#
# Denied on purpose, and why:
#   @coinbase/x402, @opensea/seaport-js, @reown/appkit, opensea-js
#       Transitive dependencies of @coinbase/agentkit that back action providers
#       this demo never registers. The demo registers only the GOL provider, so
#       no code in this repository can reach them.
#   keccak, secp256k1, bigint-buffer
#       Native crypto for agentkit's ethers-based and x402 paths. Signing in this
#       demo goes through viem and Privy, never these.
#   bufferutil, utf-8-validate
#       Optional WebSocket speedups.
allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  unrs-resolver: true
  workerd: true
  '@coinbase/x402': false
  '@opensea/seaport-js': false
  '@reown/appkit': false
  bigint-buffer: false
  bufferutil: false
  keccak: false
  opensea-js: false
  secp256k1: false
  utf-8-validate: false

# pnpm's release-age gate excludes @gol/sdk 0.5.0. It is the GOL SDK release the
# profile 4 work order depends on, and it was published 2026-09-28, so it is
# newer than the gate's default window.
minimumReleaseAgeExclude:
  - '@gol/sdk@0.5.0'

patchedDependencies:
  '@coinbase/agentkit@0.10.4': patches/@coinbase__agentkit@0.10.4.patch
